version: 1
description: Serve the sample HTTP application on 127.0.0.1 in the foreground; Ctrl-C stops it
effects: write
execution: local
timeout: 3600
tools: [python3]
parameters:
  - name: port
    flag: --port
    type: enum
    choices: ['8080', '8081']
    default: '8080'
    description: Approved local development port
