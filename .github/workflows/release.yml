name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build single-file ctrl
        run: bash build.sh

      - name: Checksum (verified by install.sh and ctrl upgrade)
        run: (cd dist && sha256sum ctrl > ctrl.sha256)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ctrl
            dist/ctrl.sha256
          generate_release_notes: true
