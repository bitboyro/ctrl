name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install yq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Install yq and ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install yq shellcheck
      - name: ShellCheck
        run: shellcheck -S warning ctrl.sh build.sh install.sh operations/*/*.sh scripts/*.sh examples/*/scripts/*.sh completions/ctrl.bash
      - name: Runner, operation, package, and installer tests
        run: python3 -m unittest discover -s tests/runner -v
      - name: Build package
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ctrl-${{ runner.os }}
          path: dist/

  real-integration:
    needs: [runner]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yq and SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Verify local Docker and Compose
        run: |
          docker info
          docker compose version
      - name: Real Docker, Compose, SSH and rsync tests
        env:
          CTRL_REAL_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests/integration -v
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-integration-diagnostics
          path: .local/integration/
          if-no-files-found: ignore
